<article
  class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 hover:shadow-md transition-shadow cursor-pointer flex gap-4 w-full h-40 overflow-hidden"
>
  <div class="w-32 h-32 shrink-0 rounded-lg overflow-hidden bg-gray-50 border border-gray-100">
    @if (article().coverImageUrl) {
      <img
        [src]="article().coverImageUrl"
        [alt]="article().title"
        class="w-full h-full object-contain"
      />
    } @else {
      <img src="favicon.ico" alt="Default cover" class="w-full h-full object-contain p-2" />
    }
  </div>

  <div class="flex-1 flex flex-col min-w-0">
    <div class="flex items-center gap-x-1.5 text-xs text-gray-500 mb-2 truncate">
      <span class="font-medium text-gray-900">{{ article().author.name }}</span>
      <span>·</span>
      <span class="font-medium text-blue-600">{{ article().category }}</span>
      <span>·</span>
      <span>{{ article().publishedAt | date: 'mediumDate' }}</span>
    </div>

    <h2 class="text-lg font-bold text-gray-900 mb-1.5 line-clamp-1">
      {{ article().title }}
    </h2>

    <p class="text-gray-600 text-sm line-clamp-2">
      {{ article().excerpt }}
    </p>
  </div>
</article>
