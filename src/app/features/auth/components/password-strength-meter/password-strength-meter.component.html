<div class="mt-2">
  <div class="flex gap-1 h-1.5 w-full bg-gray-200 rounded-full overflow-hidden">
    @for (item of scoreBars(); track $index) {
      <div
        class="h-full flex-1 transition-colors duration-300"
        [class]="score() >= item ? barColor() : 'bg-transparent'"
      ></div>
    }
  </div>

  <ul class="mt-3 grid grid-cols-2 gap-y-1 text-xs">
    @for (criterion of criteria(); track criterion.label) {
      <li
        class="flex items-center gap-1.5 transition-colors"
        [class.text-green-600]="criterion.met"
        [class.text-gray-500]="!criterion.met"
      >
        @if (criterion.met) {
          <app-icon [name]="iconNames.CHECK" class="w-3 h-3 stroke-[3px]"></app-icon>
        } @else {
          <app-icon [name]="iconNames.CROSS" class="w-3 h-3 stroke-2"></app-icon>
        }
        <span [class.line-through]="criterion.met">{{ criterion.label }}</span>
      </li>
    }
  </ul>
</div>
