<app-card [title]="texts().auth.login.title" [error]="apiError()">
  <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4">
    <app-form-input
      type="email"
      [field]="loginForm.email()"
      [texts]="texts()"
      [label]="texts().users.fields.emailLabel"
      [placeholder]="texts().users.fields.emailPlaceholder"
    >
    </app-form-input>

    <app-form-input
      type="password"
      [field]="loginForm.password()"
      [texts]="texts()"
      [label]="texts().auth.fields.passwordLabel"
      placeholder="••••••••"
    >
    </app-form-input>

    <app-button
      type="submit"
      [disabled]="loginForm().invalid()"
      [isLoading]="isLoading()"
      [loadingText]="texts().common.states.loading"
    >
      {{ texts().auth.login.submitBtn }}
    </app-button>
  </form>
  <ng-content />
</app-card>
