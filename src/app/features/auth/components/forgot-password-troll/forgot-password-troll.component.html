<button
  type="button"
  (click)="toggleTroll()"
  class="font-medium text-gray-500 hover:text-gray-800 hover:underline transition-colors cursor-pointer"
>
  {{ i18nService.texts().auth.login.forgotPasswordLink }}
</button>

@if (isTrolling()) {
  <div class="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
    <div class="text-center">
      <img
        src="https://media.giphy.com/media/Ju7l5y9osyymQ/giphy.gif"
        alt="Rickroll"
        class="w-64 h-auto rounded-lg shadow-2xl mx-auto mb-4"
      />
      <p class="text-white text-xl font-bold">
        {{ i18nService.texts().auth.login.trollMessage }}
      </p>

      <app-button variant="secondary" type="button" (click)="toggleTroll()">{{
        i18nService.texts().common.actions.close
      }}</app-button>
    </div>
  </div>
}
