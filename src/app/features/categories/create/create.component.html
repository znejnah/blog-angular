<app-modal [title]="i18nService.texts().categories.create.title" (close)="close.emit()">
  <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4">
    <div>
      <div class="mt-1">
        <app-form-input
          [label]="i18nService.texts().categories.create.fields.titleLabel"
          [texts]="i18nService.texts()"
          [field]="createForm.title()"
          [placeholder]="i18nService.texts().categories.create.fields.titlePlaceholder"
        ></app-form-input>
      </div>
    </div>

    <div>
      <div class="mt-1">
        <app-form-input
          [label]="i18nService.texts().categories.create.fields.descriptionLabel"
          [texts]="i18nService.texts()"
          [field]="createForm.description()"
          [placeholder]="i18nService.texts().categories.create.fields.descriptionPlaceholder"
        ></app-form-input>
      </div>
    </div>

    <div class="mt-8 flex items-center justify-end gap-x-4">
      <button
        type="button"
        (click)="close.emit()"
        class="text-sm font-semibold leading-6 text-gray-900 hover:text-gray-700"
        [disabled]="categoryStore.isCreating()"
      >
        {{ i18nService.texts().common.actions.cancel }}
      </button>

      <button
        type="submit"
        class="rounded-md bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 disabled:opacity-50"
        [disabled]="categoryStore.isCreating()"
      >
        @if (categoryStore.isCreating()) {
          {{ i18nService.texts().common.states.loading }}
        } @else {
          {{ i18nService.texts().categories.create.title }}
        }
      </button>
    </div>
  </form>
</app-modal>
