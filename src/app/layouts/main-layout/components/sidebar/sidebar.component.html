<aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex h-full">
  <div
    (click)="onLogoClick()"
    class="cursor-pointer hover:opacity-80 transition-opacity h-16 flex justify-center items-center px-6 border-b border-gray-200"
  >
    <img
      src="/favicon.ico"
      alt="{{ i18nService.texts().common.siteLogo }}"
      class="max-h-full w-auto"
    />
  </div>

  <nav class="flex-1 p-4 space-y-1">
    @for (item of menuItems(); track item.route) {
      <app-sidebar-item
        [to]="item.route"
        [icon]="item.icon"
        [label]="item.label"
        [exact]="item.exact"
      ></app-sidebar-item>
    }
  </nav>
</aside>
