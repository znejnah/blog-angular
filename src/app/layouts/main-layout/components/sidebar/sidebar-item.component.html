<a
  [routerLink]="to()"
  routerLinkActive="bg-blue-50 text-blue-700"
  [routerLinkActiveOptions]="{ exact: exact() }"
  class="flex items-center px-4 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-50 transition-colors group cursor-pointer"
>
  <app-icon [name]="icon()" class="mr-3 h-5 w-5 text-gray-400 group-hover:text-gray-500"></app-icon>
  {{ label() }}
</a>
