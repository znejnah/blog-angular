<app-login-form
  [texts]="i18nService.texts()"
  [isLoading]="authStore.isLoading()"
  [apiError]="translatedApiError()"
  (submitLogin)="onLoginSubmit($event)"
  class="w-full"
>
  <div class="mt-6 text-center text-sm text-gray-600">
    <app-forgot-password-troll />
  </div>
  <div class="mt-6 text-center text-sm text-gray-600">
    <app-text-link [to]="['/', routes.AUTH.ROOT, routes.AUTH.REGISTER]"
      >{{ i18nService.texts().auth.login.noAccountLink }}
    </app-text-link>
  </div>
</app-login-form>
