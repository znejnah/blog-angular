<app-register-form
  [texts]="i18nService.texts()"
  [isLoading]="authStore.isLoading()"
  [apiError]="translatedApiError()"
  (submitRegister)="onRegisterSubmit($event)"
>
  <div class="mt-6 text-center text-sm text-gray-600">
    <app-text-link [to]="['/', routes.AUTH.ROOT, routes.AUTH.LOGIN]">{{
      i18nService.texts().auth.register.hasAccountLink
    }}</app-text-link>
  </div>
</app-register-form>
