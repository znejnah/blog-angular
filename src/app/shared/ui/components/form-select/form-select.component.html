<div class="w-full">
  <label class="block text-sm font-semibold text-gray-700 mb-2">
    @if (isRequired()) {
      {{ label() }} <span class="text-red-500">*</span>
    }
  </label>

  @let state = field()();

  <div class="relative">
    <select
      [formField]="field()"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 bg-white text-gray-700"
      [class.border-red-500]="state.invalid() && state.touched()"
    >
      <ng-content></ng-content>
    </select>
  </div>

  <div class="min-h-[1.5rem] mt-1">
    @if (state.touched() && state.invalid()) {
      <ul class="text-xs text-red-600 space-y-1">
        @for (error of state.errors(); track error.kind) {
          <li>{{ error | validationError: texts() }}</li>
        }
      </ul>
    }
  </div>
</div>
