<div class="w-full max-w-md mx-auto mt-12 bg-white p-8 border border-gray-200 rounded-lg shadow-sm">
  @if (title()) {
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
      {{ title() }}
    </h2>
  }

  <div class="min-h-[2.75rem] mb-4">
    @if (error()) {
      <div class="p-3 text-sm text-red-700 bg-red-100 rounded-md">
        {{ error() }}
      </div>
    }
  </div>

  <ng-content></ng-content>
</div>
