<div class="w-full">
  <label class="block text-sm font-semibold text-gray-700 mb-2">
    @if (isRequired()) {
      {{ label() }} <span class="text-red-500">*</span>
    }
  </label>

  @let state = field()();

  <div
    class="mt-1 flex justify-center rounded-xl border-2 border-dashed border-gray-300 px-6 py-10 bg-gray-50 hover:bg-gray-100 transition-colors"
    [class.border-red-500]="state.invalid() && state.touched()"
    [class.bg-red-50]="state.invalid() && state.touched()"
  >
    <input
      type="file"
      [accept]="accept()"
      (change)="onFileChange($event)"
      class="block w-full max-w-md text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-white file:text-gray-900 file:shadow-sm hover:file:bg-gray-50 cursor-pointer transition-all"
    />
  </div>

  <div class="min-h-[1.5rem] mt-1">
    @if (state.touched() && state.invalid()) {
      <ul class="text-xs text-red-600 space-y-1">
        @for (error of state.errors(); track error.kind) {
          <li>{{ error | validationError: texts() }}</li>
        }
      </ul>
    }
  </div>
</div>
