<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">
    {{ label() }}
  </label>

  <div class="relative">
    <input
      [type]="currentType()"
      [formField]="field"
      [class]="inputClasses()"
      class="w-full px-4 py-2 border rounded-md transition-colors focus:outline-none focus:ring-2"
      [class.pr-10]="isPassword()"
      [placeholder]="placeholder()"
    />

    @if (isPassword()) {
      <button
        type="button"
        (click)="togglePassword()"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-gray-700 focus:outline-none"
      >
        <app-icon [name]="passwordIcon()" class="w-5 h-5" />
      </button>
    }
  </div>

  <div class="min-h-[1.5rem]">
    @if (hasError()) {
      <ul class="text-xs text-red-600 pt-1 space-y-1">
        @for (error of field().errors(); track error.kind) {
          <li>{{ error | validationError: texts() }}</li>
        }
      </ul>
    }
  </div>
</div>
